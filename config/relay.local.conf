worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 ipv6=off valid=60s;
    server {
        listen 8081;
        client_max_body_size 600k;
        client_body_timeout 15s;
        location ~ ^/(api/(chat|generate)|v1/(messages|chat/completions))$ {
            limit_except POST { deny all; }
            # Fixed Mac host and Ollama port. No arbitrary proxy target or admin routes.
            set $ollama_host host.docker.internal;
            proxy_pass http://$ollama_host:11434$request_uri;
            proxy_set_header Host localhost:11434;
            proxy_set_header Authorization "";
            proxy_set_header X-Api-Key "";
            proxy_set_header Cookie "";
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 130s;
            proxy_send_timeout 15s;
            proxy_connect_timeout 10s;
            proxy_next_upstream off;
            proxy_redirect off;
        }
        location / { return 404; }
    }
}
