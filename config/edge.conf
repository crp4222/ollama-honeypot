worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    server_tokens off;
    log_format minimal '$remote_addr $request_method $uri $status';
    access_log /dev/stdout minimal;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=clients:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    server {
        listen 8080;
        client_max_body_size 512k;
        client_body_timeout 15s;
        client_header_timeout 10s;
        keepalive_timeout 5s;
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow ::1;
        deny all;
        limit_req zone=clients burst=10 nodelay;
        limit_req_status 429;
        limit_conn connections 8;
        location / {
            proxy_pass http://gateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host gateway;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Authorization "";
            proxy_set_header X-Api-Key "";
            proxy_set_header Cookie "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_read_timeout 130s;
            proxy_send_timeout 15s;
        }
    }
}
